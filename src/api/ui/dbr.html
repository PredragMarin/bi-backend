<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DBR Operator Cockpit</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #18202f;
      --muted: #647085;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --danger: #b42318;
      --danger-bg: #fff1f0;
      --ok-bg: #ecfdf3;
      --ok-line: #abe4c4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    header {
      padding: 20px 24px 12px;
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px 18px 40px;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0 0 14px;
      padding: 16px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 16px;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      background: #ffffff;
      font: inherit;
    }

    input {
      min-height: 38px;
    }

    textarea {
      min-height: 210px;
      resize: vertical;
      line-height: 1.5;
      font-family: Consolas, "Liberation Mono", monospace;
    }

    button {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      color: #ffffff;
      background: var(--accent);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-strong);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: #f8fafc;
      color: var(--text);
    }

    .pill strong {
      margin-right: 5px;
      color: var(--muted);
    }

    .message {
      margin-top: 14px;
      border: 1px solid var(--ok-line);
      border-radius: 6px;
      padding: 10px;
      background: var(--ok-bg);
    }

    .message.error {
      border-color: #ffb4ab;
      background: var(--danger-bg);
      color: var(--danger);
    }

    details {
      margin-top: 12px;
    }

    summary {
      cursor: pointer;
      color: var(--muted);
      font-weight: 700;
    }

    pre {
      overflow: auto;
      max-height: 360px;
      margin: 8px 0 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      background: #0f172a;
      color: #e5e7eb;
      font-size: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      table-layout: fixed;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      background: #f8fafc;
    }

    .tables {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .workflow {
      border-color: #9cc8c3;
      box-shadow: 0 1px 0 rgba(15, 118, 110, 0.08);
    }

    .secondary {
      opacity: 0.92;
    }

    @media (max-width: 800px) {
      .grid,
      .tables {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>DBR Operator Cockpit</h1>
    <p>Versioned API v1 smoke and lifecycle view. Resolver execution is intentionally not implemented.</p>
  </header>

  <main>
    <section class="workflow">
      <h2>1. Bulk Import SIFRADN</h2>
      <div class="grid">
        <label class="wide">sifradn_paste
          <textarea id="sifradnPaste" spellcheck="false">26T20V01
26T20V02
26T20V03
26T20V04
26T20V05
26T20V06
26T20V07
26T20V08
26T20V09
26T20V10
26T20V11
26T20V12
26T20V13
26T20V14
26T20V15
26T20V16
26T20V17
26T20V18
26T20V19
26T20V20</textarea>
        </label>
        <button id="importSifradnBtn" type="button">Import SIFRADN List</button>
      </div>
      <div id="importSifradnSummary" class="summary"></div>
      <div id="importSifradnTables" class="tables"></div>
      <div id="importSifradnResult"></div>
    </section>

    <section class="secondary">
      <h2>2. Manual Create Order</h2>
      <div class="grid">
        <label>kit_code
          <input id="orderKitCode" value="OPS_S4P4">
        </label>
        <label>quantity
          <input id="orderQuantity" type="number" min="1" step="1" value="1">
        </label>
        <button id="createOrderBtn" type="button">Create Frozen Order</button>
      </div>
      <div id="createOrderSummary" class="summary"></div>
      <div id="createOrderResult"></div>
    </section>

    <section class="secondary">
      <h2>3. Manual Create Batch</h2>
      <div class="grid">
        <label>orderId
          <input id="batchOrderId" inputmode="numeric">
        </label>
        <button id="createBatchBtn" type="button">Create Kit Batch</button>
      </div>
      <div id="createBatchSummary" class="summary"></div>
      <div id="createBatchResult"></div>
    </section>

    <section>
      <h2>4. Batch Report</h2>
      <div class="grid">
        <label>batchId
          <input id="reportBatchId" inputmode="numeric">
        </label>
        <button id="loadReportBtn" type="button">Load Report</button>
      </div>
      <div id="reportSummary" class="summary"></div>
      <div id="reportTables" class="tables"></div>
      <div id="reportResult"></div>
    </section>

    <section>
      <h2>5. Run Batch</h2>
      <div class="grid">
        <label>batchId
          <input id="runBatchId" inputmode="numeric">
        </label>
        <button id="runBatchBtn" type="button">Run Batch</button>
      </div>
      <div id="runBatchSummary" class="summary"></div>
      <div id="runBatchResult"></div>
    </section>

    <section>
      <h2>6. Register Artifact</h2>
      <div class="grid">
        <label>mother_session_id
          <input id="artifactSessionId" value="SMOKE-TEST-UI-001">
        </label>
        <label>artifact_path
          <input id="artifactPath" value="/tmp/smoke/test.dxf">
        </label>
        <label>kit_code
          <input id="artifactKitCode" value="OPS_S4P4">
        </label>
        <label>part_code
          <input id="artifactPartCode" value="PPV-S4-001">
        </label>
        <button id="registerArtifactBtn" type="button">Register Artifact</button>
      </div>
      <div id="artifactSummary" class="summary"></div>
      <div id="artifactResult"></div>
    </section>
  </main>

  <script>
    const apiBase = "/api/dbr/v1";
    const state = {
      orderId: null,
      batchId: null,
      firstJobId: null
    };

    function byId(id) {
      return document.getElementById(id);
    }

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function pill(label, value) {
      return `<span class="pill"><strong>${esc(label)}</strong>${esc(value)}</span>`;
    }

    function renderRaw(containerId, payload) {
      byId(containerId).innerHTML = `
        <details>
          <summary>Raw JSON response</summary>
          <pre>${esc(JSON.stringify(payload, null, 2))}</pre>
        </details>
      `;
    }

    function renderError(containerId, payload) {
      const error = payload && payload.error ? payload.error : {};
      byId(containerId).innerHTML = `
        <div class="message error">
          <strong>${esc(error.code || "REQUEST_FAILED")}</strong><br>
          ${esc(error.message || "Request failed.")}
        </div>
        <details open>
          <summary>Raw JSON response</summary>
          <pre>${esc(JSON.stringify(payload, null, 2))}</pre>
        </details>
      `;
    }

    async function fetchJson(path, options = {}) {
      const response = await fetch(`${apiBase}${path}`, {
        cache: "no-store",
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });
      const payload = await response.json().catch(() => ({
        ok: false,
        error: {
          code: "INVALID_JSON_RESPONSE",
          message: `HTTP ${response.status}`
        }
      }));
      if (!response.ok || !payload.ok) {
        throw payload;
      }
      return payload;
    }

    async function withButton(buttonId, fn) {
      const button = byId(buttonId);
      button.disabled = true;
      try {
        await fn();
      } finally {
        button.disabled = false;
      }
    }

    function setSharedBatchId(batchId) {
      state.batchId = batchId;
      byId("reportBatchId").value = batchId || "";
      byId("runBatchId").value = batchId || "";
    }

    function renderStatusCounts(counts) {
      const rows = Object.entries(counts || {})
        .map(([status, count]) => `<tr><td>${esc(status)}</td><td>${esc(count)}</td></tr>`)
        .join("");
      return `
        <table>
          <thead><tr><th>Status</th><th>Count</th></tr></thead>
          <tbody>${rows || "<tr><td colspan=\"2\">No statuses</td></tr>"}</tbody>
        </table>
      `;
    }

    function renderJobs(jobs) {
      const rows = (Array.isArray(jobs) ? jobs : [])
        .map((job) => `
          <tr>
            <td>${esc(job.id)}</td>
            <td>${esc(job.partCode)}</td>
            <td>${esc(job.status)}</td>
            <td>${esc(job.createdAt || "")}</td>
          </tr>
        `)
        .join("");
      return `
        <table>
          <thead>
            <tr><th>job_id</th><th>part_code</th><th>status</th><th>created_at</th></tr>
          </thead>
          <tbody>${rows || "<tr><td colspan=\"4\">No jobs</td></tr>"}</tbody>
        </table>
      `;
    }

    function renderBatches(batches) {
      const rows = (Array.isArray(batches) ? batches : [])
        .map((batch) => `
          <tr>
            <td>${esc(batch.id)}</td>
            <td>${esc(batch.productCode)}</td>
            <td>${esc(batch.technologyProfile)}</td>
            <td>${esc(batch.status)}</td>
          </tr>
        `)
        .join("");
      return `
        <table>
          <thead>
            <tr><th>batch_id</th><th>product</th><th>profile</th><th>status</th></tr>
          </thead>
          <tbody>${rows || "<tr><td colspan=\"4\">No batches</td></tr>"}</tbody>
        </table>
      `;
    }

    function countJobsByBatch(jobs) {
      return (Array.isArray(jobs) ? jobs : []).reduce((counts, job) => {
        const key = String(job.kitBatchId || "");
        counts[key] = (counts[key] || 0) + 1;
        return counts;
      }, {});
    }

    function renderBatchJobSummary(batches, jobs) {
      const jobCounts = countJobsByBatch(jobs);
      const rows = (Array.isArray(batches) ? batches : [])
        .map((batch) => {
          const count = jobCounts[String(batch.id)] || 0;
          return `
            <tr>
              <td>${esc(batch.id)}</td>
              <td>${esc(count)}/12</td>
              <td>${esc(batch.status)}</td>
            </tr>
          `;
        })
        .join("");
      return `
        <table>
          <thead>
            <tr><th>batch_id</th><th>jobs</th><th>status</th></tr>
          </thead>
          <tbody>${rows || "<tr><td colspan=\"3\">No batch jobs</td></tr>"}</tbody>
        </table>
      `;
    }

    function renderImportJobs(jobs) {
      const rows = (Array.isArray(jobs) ? jobs : [])
        .map((job) => `
          <tr>
            <td>${esc(job.id)}</td>
            <td>${esc(job.kitBatchId)}</td>
            <td>${esc(job.partCode)}</td>
            <td>${esc(job.status)}</td>
          </tr>
        `)
        .join("");
      return `
        <table>
          <thead>
            <tr><th>job_id</th><th>batch_id</th><th>part_code</th><th>status</th></tr>
          </thead>
          <tbody>${rows || "<tr><td colspan=\"4\">No jobs</td></tr>"}</tbody>
        </table>
      `;
    }

    byId("importSifradnBtn").addEventListener("click", () => withButton("importSifradnBtn", async () => {
      try {
        const payload = await fetchJson("/import/sifradn-list", {
          method: "POST",
          body: JSON.stringify({
            sifradn_paste: byId("sifradnPaste").value
          })
        });
        const data = payload.data || {};
        const batches = data.batches || [];
        const jobs = data.jobs || [];
        const lastBatch = batches.length ? batches[batches.length - 1] : null;
        const firstJob = jobs.length ? jobs[0] : null;

        if (lastBatch) {
          setSharedBatchId(lastBatch.id);
        }
        if (firstJob) {
          state.firstJobId = firstJob.id;
        }

        byId("importSifradnSummary").innerHTML = [
          pill("input", data.requested || 0),
          pill("imported", data.imported || 0),
          pill("batches", batches.length),
          pill("totalJobs", data.totalJobs || jobs.length),
          pill("last batch", lastBatch ? lastBatch.id : "")
        ].join("");
        byId("importSifradnTables").innerHTML = `
          <div>
            ${renderBatches(batches)}
            ${renderBatchJobSummary(batches, jobs)}
          </div>
          <div>${renderImportJobs(jobs)}</div>
        `;
        renderRaw("importSifradnResult", payload);
      } catch (errorPayload) {
        byId("importSifradnTables").innerHTML = "";
        renderError("importSifradnResult", errorPayload);
      }
    }));

    byId("createOrderBtn").addEventListener("click", () => withButton("createOrderBtn", async () => {
      try {
        const payload = await fetchJson("/orders", {
          method: "POST",
          body: JSON.stringify({
            kit_code: byId("orderKitCode").value.trim() || "OPS_S4P4",
            quantity: Number(byId("orderQuantity").value || 1)
          })
        });
        const order = payload.data.order;
        state.orderId = order.id;
        byId("batchOrderId").value = order.id;
        byId("createOrderSummary").innerHTML = [
          pill("order.id", order.id),
          pill("status", order.status),
          pill("dbr_key", order.gosoftDnKey)
        ].join("");
        renderRaw("createOrderResult", payload);
      } catch (errorPayload) {
        renderError("createOrderResult", errorPayload);
      }
    }));

    byId("createBatchBtn").addEventListener("click", () => withButton("createBatchBtn", async () => {
      try {
        const orderId = byId("batchOrderId").value.trim();
        const payload = await fetchJson(`/orders/${encodeURIComponent(orderId)}/batches`, {
          method: "POST",
          body: "{}"
        });
        const batch = payload.data.batch;
        const jobs = payload.data.jobs || [];
        state.firstJobId = jobs.length ? jobs[0].id : null;
        setSharedBatchId(batch.id);
        byId("createBatchSummary").innerHTML = [
          pill("batch.id", batch.id),
          pill("job count", jobs.length)
        ].join("");
        renderRaw("createBatchResult", payload);
      } catch (errorPayload) {
        renderError("createBatchResult", errorPayload);
      }
    }));

    byId("loadReportBtn").addEventListener("click", () => withButton("loadReportBtn", async () => {
      try {
        const batchId = byId("reportBatchId").value.trim();
        const payload = await fetchJson(`/batches/${encodeURIComponent(batchId)}/report`);
        const report = payload.data.report;
        byId("reportSummary").innerHTML = [
          pill("batch.id", report.batch.id),
          pill("partJobCount", report.partJobCount)
        ].join("");
        byId("reportTables").innerHTML = `
          <div>${renderStatusCounts(report.statusCounts)}</div>
          <div>${renderJobs(report.partJobs)}</div>
        `;
        renderRaw("reportResult", payload);
      } catch (errorPayload) {
        byId("reportTables").innerHTML = "";
        renderError("reportResult", errorPayload);
      }
    }));

    byId("runBatchBtn").addEventListener("click", () => withButton("runBatchBtn", async () => {
      try {
        const batchId = byId("runBatchId").value.trim();
        const payload = await fetchJson(`/batches/${encodeURIComponent(batchId)}/run`, {
          method: "POST",
          body: "{}"
        });
        byId("runBatchSummary").innerHTML = [
          pill("status", payload.data.status),
          pill("partJobCount", payload.data.partJobCount)
        ].join("");
        renderRaw("runBatchResult", payload);
      } catch (errorPayload) {
        renderError("runBatchResult", errorPayload);
      }
    }));

    byId("registerArtifactBtn").addEventListener("click", () => withButton("registerArtifactBtn", async () => {
      try {
        const payload = await fetchJson("/artifacts", {
          method: "POST",
          body: JSON.stringify({
            mother_session_id: byId("artifactSessionId").value.trim(),
            artifact_path: byId("artifactPath").value.trim(),
            kit_code: byId("artifactKitCode").value.trim(),
            part_code: byId("artifactPartCode").value.trim()
          })
        });
        const artifact = payload.data.artifact;
        byId("artifactSummary").innerHTML = [
          pill("artifact id", artifact.id),
          pill("created_at", artifact.createdAt)
        ].join("");
        renderRaw("artifactResult", payload);
      } catch (errorPayload) {
        renderError("artifactResult", errorPayload);
      }
    }));
  </script>
</body>
</html>
